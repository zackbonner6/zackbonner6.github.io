<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 7 - Drawing A Road</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #e8e4da;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background-color: #ffffff;
    border: 2px solid #ccc4b0;
    border-radius: 10px;
    max-width: 900px;
    width: 100%;
    padding: 20px;
    text-align: center;
  }
  h1 {
    margin: 0 0 4px 0;
    color: #2b3a2b;
  }
  h2 {
    margin: 0 0 20px 0;
    color: #4c7a3f;
    font-size: 18px;
  }
  /* Dashed center line made with a repeating-linear-gradient, technique adapted from a CSS-Tricks striped background example */
  .road {
    position: relative;
    height: 320px;
    background-color: #3a3a3a;
    border-top: 6px solid #f2f2f2;
    border-bottom: 6px solid #f2f2f2;
    border-radius: 6px;
    overflow: hidden;
  }
  .center-line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 6px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(to right, #f2d94e 0px, #f2d94e 40px, transparent 40px, transparent 80px);
  }
  .car {
    position: absolute;
    height: 34px;
    border-radius: 6px;
  }
  .car-top {
    position: absolute;
    top: -12px;
    height: 16px;
    border-radius: 4px 4px 0 0;
  }
  .wheel {
    position: absolute;
    bottom: -6px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #1a1a1a;
  }
  .wheel-left {
    left: 8px;
  }
  .wheel-right {
    right: 8px;
  }
  footer {
    margin-top: 20px;
    font-size: 13px;
    color: #888;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Assignment 7</h1>
  <h2>Drawing A Road</h2>

  <div class="road" id="road">
    <div class="center-line"></div>
  </div>

  <footer>@zackbonner</footer>
</div>

<script>
  const CAR_COLORS = ["#d1495b", "#3d5a80", "#e8a33d", "#588157", "#7b4b94"];

  const createCar = (container, laneTop, color, carWidth) => {
    let car = document.createElement("div");
    car.className = "car";
    car.style.backgroundColor = color;
    car.style.width = carWidth + "px";
    car.style.top = laneTop + "px";
    car.style.left = Math.random() * (container.clientWidth - carWidth) + "px";
    container.appendChild(car);

    let topPiece = document.createElement("div");
    topPiece.className = "car-top";
    topPiece.style.backgroundColor = color;
    topPiece.style.width = (carWidth * 0.6) + "px";
    topPiece.style.left = (carWidth * 0.2) + "px";
    car.appendChild(topPiece);

    let wheelLeft = document.createElement("div");
    wheelLeft.className = "wheel wheel-left";
    car.appendChild(wheelLeft);

    let wheelRight = document.createElement("div");
    wheelRight.className = "wheel wheel-right";
    car.appendChild(wheelRight);
  };

  window.onload = () => {
    let road = document.getElementById("road");
    let carCount = Math.floor(Math.random() * 4) + 5;

    for (let i = 0; i < carCount; i++) {
      let lane = Math.random() < 0.5 ? 40 + Math.random() * 30 : 210 + Math.random() * 30;
      let color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
      let width = 60 + Math.random() * 20;
      createCar(road, lane, color, width);
    }
  };
</script>

</body>
</html>
