<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 6 - JavaScript Conditionals</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #F5EBDD;
    color: #3B2A20;
  }

  nav {
    background-color: #4B2E1E;
    padding: 10px 20px;
  }

  .nav-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-title {
    color: #FFF8F0;
    font-weight: bold;
  }

  #nav-toggle {
    background: none;
    border: none;
    color: #FFF8F0;
    font-size: 1.2em;
    cursor: pointer;
    display: none;
  }

  .nav-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .nav-links li a {
    color: #E8C9A0;
    text-decoration: none;
    font-weight: bold;
    padding: 6px 10px;
    cursor: pointer;
    display: block;
  }

  .nav-links li a:hover {
    color: #FFF8F0;
  }

  .nav-links li:not(:last-child)::after {
    content: "|";
    color: #E8C9A0;
  }

  @media (max-width: 600px) {
    #nav-toggle {
      display: block;
    }

    .nav-links {
      margin-top: 10px;
    }

    .nav-links.nav-hidden {
      display: none;
    }

    .nav-links li:not(:last-child)::after {
      content: "";
    }

    .nav-links li a {
      padding: 8px 0;
    }
  }

  main {
    max-width: 500px;
    margin: 40px auto;
    background-color: #FFF8F0;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 4px 14px rgba(75, 46, 30, 0.2);
    text-align: center;
  }

  main h1 {
    margin-top: 0;
    color: #4B2E1E;
  }

  .field {
    margin: 16px 0;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }

  input[type="number"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #C9A66B;
    border-radius: 6px;
  }

  button.calc-btn {
    margin-top: 10px;
    background-color: #A9642F;
    color: #FFF8F0;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  button.calc-btn:hover {
    background-color: #7A4A22;
  }

  .result {
    margin-top: 16px;
    font-weight: bold;
    color: #4B2E1E;
    min-height: 24px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-top">
    <span class="nav-title">Assignment 6</span>
    <button id="nav-toggle">&#9660;</button>
  </div>
  <ul class="nav-links nav-hidden" id="nav-links">
    <li><a id="link-ex1">Exercise 1</a></li>
    <li><a id="link-ex2">Exercise 2</a></li>
  </ul>
</nav>

<main>

  <section id="exercise1">
    <h1>Missing Class Points Deduction</h1>
    <div class="field">
      <label for="days-missed">How many days do you intend to miss class?</label>
      <input type="number" id="days-missed" min="0">
    </div>
    <button class="calc-btn" id="calc-btn1">Calculate</button>
    <p class="result" id="result1-msg"></p>
  </section>

  <section id="exercise2" class="hidden">
    <h1>End of Semester Counter</h1>
    <p>Find out how many days of class you have left this semester.</p>
    <button class="calc-btn" id="calc-btn2">Calculate My Days Left</button>
    <p class="result" id="result2-msg"></p>
  </section>

</main>

<script>
  const toggleNav = () => {
    document.getElementById("nav-links").classList.toggle("nav-hidden");
    if (document.getElementById("nav-links").classList.contains("nav-hidden")) {
      document.getElementById("nav-toggle").innerHTML = "&#9660;";
    } else {
      document.getElementById("nav-toggle").innerHTML = "&#9650;";
    }
  };

  const showExercise1 = () => {
    document.getElementById("exercise1").classList.remove("hidden");
    document.getElementById("exercise2").classList.add("hidden");
  };

  const showExercise2 = () => {
    document.getElementById("exercise2").classList.remove("hidden");
    document.getElementById("exercise1").classList.add("hidden");
  };

  const calcExercise1 = () => {
    let input = document.getElementById("days-missed").value;
    let days = Number(input);

    if (input === "" || isNaN(days)) {
      document.getElementById("result1-msg").textContent = "Enter a number.";
      return;
    }

    let pct = ((days / 25) * 7).toFixed(2);

    if (days <= 0) {
      document.getElementById("result1-msg").textContent = "No days missed, you keep the full 7%.";
    } else if (days <= 2) {
      document.getElementById("result1-msg").textContent = "Only " + pct + "% lost, not bad.";
    } else if (days <= 5) {
      document.getElementById("result1-msg").textContent = "You'll lose " + pct + "%, try not to miss more.";
    } else if (days <= 10) {
      document.getElementById("result1-msg").textContent = "That's " + pct + "% of your grade gone.";
    } else {
      document.getElementById("result1-msg").textContent = "You're missing a lot, " + pct + "% lost.";
    }
  };

  const calcExercise2 = () => {
    let today = new Date();
    let year = today.getFullYear();
    let lastDay = new Date(year, 11, 4);

    if (today > lastDay) {
      lastDay = new Date(year + 1, 11, 4);
    }

    let oneDay = 1000 * 60 * 60 * 24;
    let daysLeft = Math.ceil((lastDay - today) / oneDay);

    if (daysLeft <= 0) {
      document.getElementById("result2-msg").textContent = "Last day of class!";
    } else if (daysLeft <= 7) {
      document.getElementById("result2-msg").textContent = daysLeft + " days left, almost done.";
    } else if (daysLeft <= 30) {
      document.getElementById("result2-msg").textContent = daysLeft + " days left in the semester.";
    } else if (daysLeft <= 60) {
      document.getElementById("result2-msg").textContent = daysLeft + " days left, you're past halfway.";
    } else {
      document.getElementById("result2-msg").textContent = daysLeft + " days left, still plenty of time.";
    }
  };

  window.onload = () => {
    document.getElementById("nav-toggle").onclick = toggleNav;
    document.getElementById("link-ex1").onclick = showExercise1;
    document.getElementById("link-ex2").onclick = showExercise2;
    document.getElementById("calc-btn1").onclick = calcExercise1;
    document.getElementById("calc-btn2").onclick = calcExercise2;
  };
</script>

</body>
</html>
